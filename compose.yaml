services:
    mariadb:
        image: mariadb:11.4
        container_name: fib-mariadb
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: shopware
        ports:
            - '3306'
        volumes:
            - mariadb_data:/var/lib/mysql
        command: --max_allowed_packet=1073741824
        healthcheck:
            test: ['CMD', 'mariadb-admin', 'ping', '-uroot', '-proot', '--silent']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        networks:
            shopware:
                aliases:
                    - db.booking.docker

    redis:
        image: redis:7-alpine
        container_name: fib-redis
        command: ['redis-server', '--requirepass', 'redis']
        ports:
            - '6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', 'redis', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - shopware

    mailpit:
        image: axllent/mailpit:latest
        container_name: fib-mailpit
        ports:
            - '127.0.0.1:8095:8025'
        networks:
            - shopware

    scanner:
        image: nginx:alpine
        container_name: fib-scanner
        ports:
            # localhost fallback — also the URL for CAMERA scanning in dev:
            # browsers only grant camera access in secure contexts (https or
            # localhost), so use http://127.0.0.1:8096 when testing the camera.
            - '127.0.0.1:8096:80'
        volumes:
            - ./custom/static-plugins/FibBookingSystem/apps/scanner/dist:/usr/share/nginx/html:ro
            - ./docker/scanner-nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            shopware:
                condition: service_healthy
        networks:
            - shopware

    adminer:
        image: adminer:latest
        container_name: fib-adminer
        environment:
            - ADMINER_DEFAULT_SERVER=mariadb
        networks:
            - shopware
        depends_on:
            - mariadb

    # Optional: public HTTPS tunnel to the scanner app (e.g. to scan with a
    # real phone camera — browsers require a secure context for camera access).
    # Opt-in via profile: `make scanner-ngrok` (needs NGROK_AUTHTOKEN).
    ngrok:
        image: ngrok/ngrok:latest
        container_name: fib-ngrok
        profiles:
            - ngrok
        command: ['http', 'fib-scanner:80', '--log', 'stdout']
        environment:
            - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
        depends_on:
            - scanner
        networks:
            - shopware

    ingress:
        image: nginx:alpine
        container_name: fib-ingress
        environment:
            - VIRTUAL_HOST=booking.docker,*.booking.docker
        volumes:
            - ./docker/ingress.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/502-watcher.html:/usr/share/nginx/html/502-watcher.html:ro
        depends_on:
            shopware:
                condition: service_healthy
        networks:
            shopware:
                aliases:
                    - ingress.booking.docker
            proxy:

    shopware:
        image: dockware/dev:6.7.1.0
        container_name: fib-shopware
        env_file: '.env.local'
        depends_on:
            mariadb:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'php', '-v']
            interval: 5s
            timeout: 5s
            retries: 24
            start_period: 30s
        environment:
            - XDEBUG_ENABLED=${XDEBUG_ENABLED:-0}
            - DATABASE_URL=mysql://root:root@mariadb:3306/shopware
            # Used by docker/setup-dev.sh to derive the sales channel domain;
            # HTTP routing happens in the ingress container (docker/ingress.conf).
            - VIRTUAL_HOST=booking.docker
        ports:
            - '127.0.0.1:8090:80'
        volumes:
            - ./bin:/var/www/html/bin
            - ./config:/var/www/html/config
            - ./custom:/var/www/html/custom
            - ./public:/var/www/html/public
            - ./src:/var/www/html/src
            - ./vendor:/var/www/html/vendor
            - ./composer.json:/var/www/html/composer.json
            - ./composer.lock:/var/www/html/composer.lock
            - ./symfony.lock:/var/www/html/symfony.lock
            - ./.env:/var/www/html/.env
            - ./.env.local:/var/www/html/.env.local
            - ./.build:/var/www/html/.build
            - ./docker/setup-dev.sh:/setup-dev.sh
        networks:
            shopware:
                aliases:
                    - booking.docker

volumes:
    mariadb_data:
    redis_data:

networks:
    shopware:
        driver: bridge
    proxy:
        external: true

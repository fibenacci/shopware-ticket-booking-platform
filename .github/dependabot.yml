# Automated dependency updates. Weekly cadence, minor/patch grouped into one
# PR per ecosystem to keep noise low; majors stay separate for review.
# Security advisories always open immediately regardless of schedule.
version: 2
updates:
    -   package-ecosystem: composer
        directory: /
        schedule:
            interval: weekly
            day: monday
        groups:
            composer-minor-patch:
                update-types: [minor, patch]
        open-pull-requests-limit: 10

    -   package-ecosystem: npm
        directories:
            - /custom/static-plugins/FibBookingSystem/apps/scanner
            - /custom/static-plugins/FibBookingSystem
        schedule:
            interval: weekly
            day: monday
        groups:
            npm-minor-patch:
                update-types: [minor, patch]
        open-pull-requests-limit: 10

    -   package-ecosystem: docker
        directories:
            - /
            - /.github/ci
        schedule:
            interval: weekly
            day: monday

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
            day: monday
        groups:
            actions:
                update-types: [minor, patch]

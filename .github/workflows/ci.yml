name: Shopware CI

on:
    pull_request:
    push:
        branches:
            - trunk
            - main
        tags:
            - 'v*'
            - 'scanner-v*'
    workflow_dispatch:

concurrency:
    group: shopware-ci-${{ github.ref }}
    cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN — read-only by default. Jobs that need
# more (publish-results: checks + PR description) declare their own block.
permissions:
    contents: read

env:
    PHP_VERSION: '8.3'
    PHP_EXTENSIONS: gd, intl, mbstring, pdo_mysql, zip, curl, dom, fileinfo, opcache
    NODE_VERSION: '22'

jobs:
    quality:
        name: Static Quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v6
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    tools: composer:v2
                    coverage: none
            -   uses: actions/cache@v5
                with:
                    path: ~/.composer/cache
                    key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ runner.os }}-
            -   name: Install dependencies
                run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
            -   name: PHP-CS-Fixer
                run: make php-cs-fixer-check
            -   name: PHPStan
                run: make phpstan
            -   name: PHPMD
                run: make phpmd

    lint:
        name: JS/TS Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v6
                with:
                    node-version: ${{ env.NODE_VERSION }}
                    cache: npm
                    cache-dependency-path: |
                        custom/static-plugins/FibBookingSystem/apps/scanner/package-lock.json
                        custom/static-plugins/FibBookingSystem/apps/seat-picker/package-lock.json
                        custom/static-plugins/FibBookingSystem/src/Resources/app/administration/package-lock.json
                        custom/static-plugins/FibBookingSystem/package-lock.json

            -   id: scanner_build
                name: Scanner app — install + production build (type/syntax gate)
                working-directory: custom/static-plugins/FibBookingSystem/apps/scanner
                run: |
                    npm ci
                    npm run build

            -   id: scanner_tests
                name: Scanner app — vitest unit tests
                working-directory: custom/static-plugins/FibBookingSystem/apps/scanner
                run: npm test

            -   id: seatpicker_tests
                name: Seat picker — install + build + vitest unit tests
                working-directory: custom/static-plugins/FibBookingSystem/apps/seat-picker
                run: |
                    npm ci
                    npm run build
                    npm test

            -   id: admin_tests
                name: Admin extension — vitest unit tests
                working-directory: custom/static-plugins/FibBookingSystem/src/Resources/app/administration
                run: |
                    npm ci
                    npm test

            -   id: node_syntax
                name: Plugin storefront JS — syntax check
                run: .github/scripts/check-plugin-js.sh

            -   name: Gate — fail on any lint finding
                if: always()
                run: |
                    .github/scripts/gate.sh "Lint failures — see the steps above." \
                        "Scanner app build=${{ steps.scanner_build.outcome }}" \
                        "Scanner app tests=${{ steps.scanner_tests.outcome }}" \
                        "Seat picker build+tests=${{ steps.seatpicker_tests.outcome }}" \
                        "Admin extension tests=${{ steps.admin_tests.outcome }}" \
                        "Plugin JS syntax=${{ steps.node_syntax.outcome }}"

    mobile-test:
        name: Mobile scanner — analyze + test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v6
            -   uses: subosito/flutter-action@v2
                with:
                    channel: stable
            -   run: .github/scripts/test-mobile.sh

    composer-audit:
        name: Composer Audit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v6
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    tools: composer:v2
                    coverage: none
            -   name: composer audit (PHP dependencies)
                run: composer audit --locked --format=plain --abandoned=ignore

    npm-audit:
        name: NPM Audit
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v6
                with:
                    node-version: ${{ env.NODE_VERSION }}
                    cache: npm
                    cache-dependency-path: |
                        custom/static-plugins/FibBookingSystem/apps/scanner/package-lock.json
                        custom/static-plugins/FibBookingSystem/package-lock.json

            -   id: npm_audit_scanner
                name: npm audit — scanner app
                working-directory: custom/static-plugins/FibBookingSystem/apps/scanner
                run: npm audit --audit-level=high
            -   id: npm_audit_e2e
                name: npm audit — Playwright suite
                working-directory: custom/static-plugins/FibBookingSystem
                run: npm audit --audit-level=high
            -   name: Gate — fail on any high npm advisory
                if: always()
                run: |
                    .github/scripts/gate.sh "High-severity npm advisories found — see the steps above." \
                        "npm audit scanner app=${{ steps.npm_audit_scanner.outcome }}" \
                        "npm audit Playwright suite=${{ steps.npm_audit_e2e.outcome }}"

    # Plain single job on purpose: reusable-workflow calls AND matrix jobs each
    # get their own pinned box in the run graph. As a regular job sharing the
    # audits' needs/dependents it renders in the same group, ordered below them
    # by definition order. Both languages are analyzed in one job; the weekly
    # re-scan lives in codeql.yml; the project-specific scope is shared via
    # .github/codeql/codeql-config.yml. CodeQL has no PHP support — PHP is
    # covered by PHPStan + composer audit.
    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        steps:
            -   uses: actions/checkout@v6
            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: actions,javascript-typescript
                    build-mode: none
                    config-file: ./.github/codeql/codeql-config.yml
            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4

    shopware-validate:
        name: Shopware Extension Validate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v6
            -   uses: shopware/shopware-cli-action@v3
            -   name: Validate maintained plugins
                run: .github/scripts/validate-plugins.sh

    security-gate:
        name: Security Gate
        needs: [npm-audit, composer-audit, codeql]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -   run: echo "✅ npm audit + composer audit + CodeQL analysis passed."

    quality-gate:
        name: Quality Gate
        needs: [quality, lint, shopware-validate, mobile-test]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -   run: echo "✅ static quality + JS/TS lint + shopware-validate + mobile passed."

    tests:
        name: PHPUnit + Playwright
        needs: [quality-gate, security-gate]
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            COMPOSE_PROJECT_NAME: fib-booking-shop-tests
            STOREFRONT_PORT: '8080'
        steps:
            -   uses: actions/checkout@v6

            -   uses: actions/setup-node@v6
                with:
                    node-version: ${{ env.NODE_VERSION }}
                    cache: npm
                    cache-dependency-path: |
                        custom/static-plugins/FibBookingSystem/package-lock.json

            -   uses: actions/cache@v5
                with:
                    path: ~/.cache/ms-playwright
                    key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('custom/static-plugins/FibBookingSystem/package-lock.json') }}
                    restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-

            -   name: Bootstrap CI stack
                run: make ci-bootstrap

            -   id: phpunit
                name: Run PHPUnit
                run: make ci-phpunit

            -   id: e2e_booking
                name: Booking Playwright suite
                run: make ci-e2e

            -   name: Upload JUnit results
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: junit-results
                    path: junit-artifacts/
                    if-no-files-found: ignore

            -   name: Upload Playwright reports
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-reports
                    path: |
                        custom/static-plugins/FibBookingSystem/playwright-report
                        custom/static-plugins/FibBookingSystem/test-results
                    if-no-files-found: ignore

            -   name: Tear down stack (with logs)
                if: failure()
                run: make ci-teardown WITH_LOGS=1

            -   name: Tear down stack
                if: success() || cancelled()
                run: make ci-teardown

            -   name: Gate — fail on any failed test suite
                if: always()
                run: |
                    .github/scripts/gate.sh "One or more test suites failed — see the suite steps above and the published reports." \
                        "PHPUnit=${{ steps.phpunit.outcome }}" \
                        "Booking Playwright suite=${{ steps.e2e_booking.outcome }}"

    publish-results:
        name: Publish Test Results
        needs: [tests, quality-gate, security-gate]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
            pull-requests: write
        steps:
            -   uses: actions/checkout@v6

            -   name: Download JUnit results
                continue-on-error: true
                uses: actions/download-artifact@v8
                with:
                    name: junit-results
                    path: junit-results

            -   id: phpunit-report
                name: Publish PHPUnit report
                if: ${{ needs.tests.result == 'success' || needs.tests.result == 'failure' }}
                uses: dorny/test-reporter@v3
                with:
                    name: PHPUnit
                    path: 'junit-results/phpunit-fib-booking-system.xml'
                    reporter: java-junit
                    list-tests: failed
                    list-suites: all
                    fail-on-error: false
                    fail-on-empty: false

            -   id: phpunit-demodata-report
                name: Publish PHPUnit (DemoData) report
                if: ${{ needs.tests.result == 'success' || needs.tests.result == 'failure' }}
                uses: dorny/test-reporter@v3
                with:
                    name: PHPUnit — DemoData
                    path: 'junit-results/phpunit-fib-booking-demo-data.xml'
                    reporter: java-junit
                    list-tests: failed
                    list-suites: all
                    fail-on-error: false
                    fail-on-empty: false

            -   id: e2e-booking-report
                name: Publish Booking Playwright report
                if: ${{ needs.tests.result == 'success' || needs.tests.result == 'failure' }}
                uses: dorny/test-reporter@v3
                with:
                    name: Playwright — Booking
                    path: 'junit-results/playwright-booking.xml'
                    reporter: java-junit
                    list-tests: failed
                    list-suites: all
                    fail-on-error: false
                    fail-on-empty: false

            -   name: Update PR description with test results
                if: ${{ github.event_name == 'pull_request' }}
                uses: actions/github-script@v9
                env:
                    PHPUNIT_REPORT_URL: ${{ steps.phpunit-report.outputs.url_html }}
                    PHPUNIT_DEMODATA_REPORT_URL: ${{ steps.phpunit-demodata-report.outputs.url_html }}
                    E2E_BOOKING_REPORT_URL: ${{ steps.e2e-booking-report.outputs.url_html }}
                    TESTS_RESULT: ${{ needs.tests.result }}
                    QUALITY_GATE_RESULT: ${{ needs.quality-gate.result }}
                    SECURITY_GATE_RESULT: ${{ needs.security-gate.result }}
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    script: |
                        const updatePr = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/update-pr-test-results.js`);
                        await updatePr({ github, context, core });

    report-ci:
        name: Report CI
        needs: [quality-gate, security-gate, tests, publish-results]
        if: always()
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   name: Check CI results
                run: |
                    if [ "${{ needs.publish-results.result }}" = "failure" ]; then
                        echo "::warning::publish-results failed — reports/PR comment may be missing."
                    fi
                    GATE_STRICT=1 .github/scripts/gate.sh \
                        "One or more required CI jobs failed, were cancelled, or were skipped (upstream gate red)." \
                        "quality-gate (quality + lint + shopware-validate)=${{ needs.quality-gate.result }}" \
                        "security-gate (npm-audit + composer-audit + codeql)=${{ needs.security-gate.result }}" \
                        "tests=${{ needs.tests.result }}"

    build-docker:
        needs: [report-ci]
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/trunk' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/fib-booking-system
            SCANNER_IMAGE: ghcr.io/${{ github.repository_owner }}/fib-booking-scanner
        steps:
            -   uses: actions/checkout@v6
            -   uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -   uses: docker/setup-buildx-action@v4
            -   id: meta
                uses: docker/metadata-action@v6
                with:
                    images: ${{ env.IMAGE }}
                    tags: |
                        type=ref,event=tag
                        type=raw,value=latest,enable={{is_default_branch}}
                        type=sha
            # Build locally first so Trivy gates BEFORE anything reaches GHCR.
            -   name: Build shop image (local, for scan)
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: Dockerfile
                    push: false
                    load: true
                    tags: ${{ env.IMAGE }}:scan
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
            -   name: Trivy scan (shop image)
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    image-ref: ${{ env.IMAGE }}:scan
                    severity: CRITICAL,HIGH
                    exit-code: '1'
                    ignore-unfixed: true
            -   name: Build & push shop image
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: Dockerfile
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
            -   id: meta_scanner
                uses: docker/metadata-action@v6
                with:
                    images: ${{ env.SCANNER_IMAGE }}
                    tags: |
                        type=ref,event=tag
                        type=raw,value=latest,enable={{is_default_branch}}
                        type=sha
            -   name: Build scanner image (local, for scan)
                uses: docker/build-push-action@v7
                with:
                    context: custom/static-plugins/FibBookingSystem/apps/scanner
                    push: false
                    load: true
                    tags: ${{ env.SCANNER_IMAGE }}:scan
                    cache-from: type=gha,scope=scanner
                    cache-to: type=gha,mode=max,scope=scanner
            -   name: Trivy scan (scanner image)
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    image-ref: ${{ env.SCANNER_IMAGE }}:scan
                    severity: CRITICAL,HIGH
                    exit-code: '1'
                    ignore-unfixed: true
            -   name: Build & push scanner image
                uses: docker/build-push-action@v7
                with:
                    context: custom/static-plugins/FibBookingSystem/apps/scanner
                    push: true
                    tags: ${{ steps.meta_scanner.outputs.tags }}
                    labels: ${{ steps.meta_scanner.outputs.labels }}
                    cache-from: type=gha,scope=scanner
                    cache-to: type=gha,mode=max,scope=scanner

    # Mobile scanner artifacts: scanner-v* tags only (macOS runner for iOS).
    build-mobile-android:
        needs: [report-ci]
        if: ${{ startsWith(github.ref, 'refs/tags/scanner-v') }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: subosito/flutter-action@v2
                with:
                    channel: stable
            -   run: .github/scripts/build-android.sh "${{ github.ref_name }}"
            -   uses: actions/upload-artifact@v4
                with:
                    name: scanner-android
                    path: custom/static-plugins/FibBookingSystem/apps/scanner-mobile/build/scanner-*.apk
                    if-no-files-found: error

    build-mobile-ios:
        needs: [report-ci]
        if: ${{ startsWith(github.ref, 'refs/tags/scanner-v') }}
        runs-on: macos-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: subosito/flutter-action@v2
                with:
                    channel: stable
            -   run: .github/scripts/build-ios.sh "${{ github.ref_name }}"
            -   uses: actions/upload-artifact@v4
                with:
                    name: scanner-ios
                    path: custom/static-plugins/FibBookingSystem/apps/scanner-mobile/build/ipa/scanner-*-unsigned.ipa
                    if-no-files-found: error

    release-mobile:
        needs: [build-mobile-android, build-mobile-ios]
        if: ${{ startsWith(github.ref, 'refs/tags/scanner-v') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/download-artifact@v4
                with:
                    path: dist
            -   env:
                    GH_TOKEN: ${{ github.token }}
                run: .github/scripts/publish-mobile-release.sh "${{ github.ref_name }}" dist/scanner-android/*.apk dist/scanner-ios/*.ipa

name: Build & Push Docker Image

# Builds the production image (Dockerfile) and pushes it to GHCR.
# compose.prod.yaml on the target host pulls this image.

on:
    workflow_dispatch:
    push:
        branches:
            - trunk
            - main
        tags:
            - 'v*'

env:
    IMAGE: ghcr.io/${{ github.repository_owner }}/fib-booking-system
    SCANNER_IMAGE: ghcr.io/${{ github.repository_owner }}/fib-booking-scanner

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Log in to GHCR
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Set up Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Docker metadata (tags)
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: ${{ env.IMAGE }}
                    tags: |
                        type=ref,event=tag
                        type=raw,value=latest,enable={{is_default_branch}}
                        type=sha

            -   name: Build & push
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: Dockerfile
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max

            -   name: Docker metadata (scanner tags)
                id: meta_scanner
                uses: docker/metadata-action@v6
                with:
                    images: ${{ env.SCANNER_IMAGE }}
                    tags: |
                        type=ref,event=tag
                        type=raw,value=latest,enable={{is_default_branch}}
                        type=sha

            -   name: Build & push scanner app
                uses: docker/build-push-action@v7
                with:
                    context: custom/static-plugins/FibBookingSystem/apps/scanner
                    push: true
                    tags: ${{ steps.meta_scanner.outputs.tags }}
                    labels: ${{ steps.meta_scanner.outputs.labels }}
                    cache-from: type=gha,scope=scanner
                    cache-to: type=gha,mode=max,scope=scanner

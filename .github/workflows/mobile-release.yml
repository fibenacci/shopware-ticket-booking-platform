name: Mobile scanner

# Tests run on every PR touching the app; build + release artifacts are
# produced on scanner-v* tags (and on-demand via dispatch). GitHub Actions —
# including the macOS runner — is free for public repos, so this costs nothing.
on:
  push:
    tags: ['scanner-v*']
  pull_request:
    paths:
      - 'custom/static-plugins/FibBookingSystem/apps/scanner-mobile/**'
      - '.github/scripts/test-mobile.sh'
      - '.github/scripts/build-android.sh'
      - '.github/scripts/build-ios.sh'
      - '.github/scripts/publish-mobile-release.sh'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: .github/scripts/test-mobile.sh

  android:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: .github/scripts/build-android.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-android
          path: custom/static-plugins/FibBookingSystem/apps/scanner-mobile/build/scanner-*.apk
          if-no-files-found: error

  ios:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: .github/scripts/build-ios.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-ios
          path: custom/static-plugins/FibBookingSystem/apps/scanner-mobile/build/ipa/scanner-*-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/scanner-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-mobile-release.sh "${{ github.ref_name }}" dist/scanner-android/*.apk dist/scanner-ios/*.ipa

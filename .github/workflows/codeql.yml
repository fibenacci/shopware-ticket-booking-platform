name: CodeQL

# Static security analysis (SAST) for everything CodeQL can analyze in this
# project: the scanner app + plugin JS (javascript-typescript) and the GitHub
# workflows (actions). PHP is NOT supported by CodeQL — its security coverage
# comes from PHPStan + composer audit in the CI pipeline.
#
# Two entry points:
#   - workflow_call: ci.yml runs this as the `codeql` job so the security
#     gate depends on a completed, uploaded analysis
#   - schedule:      weekly re-scan so NEW CodeQL queries are applied to
#                    existing code without waiting for a push
#
# Project-specific scope/queries live in .github/codeql/codeql-config.yml.

on:
    workflow_call:
    schedule:
        -   cron: '19 17 * * 6'

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   language: actions
                        build-mode: none
                    -   language: javascript-typescript
                        build-mode: none
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: ${{ matrix.language }}
                    build-mode: ${{ matrix.build-mode }}
                    config-file: ./.github/codeql/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: '/language:${{ matrix.language }}'

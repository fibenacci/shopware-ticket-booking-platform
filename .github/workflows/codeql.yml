name: CodeQL

# Weekly scheduled CodeQL re-scan: applies NEW CodeQL queries to existing
# code without waiting for a push. The per-push/PR analysis gating the
# security gate is the `codeql` job in ci.yml; both share the project
# scope in .github/codeql/codeql-config.yml.
#
# PHP is NOT supported by CodeQL — its security coverage comes from
# PHPStan + composer audit in the CI pipeline.

on:
    workflow_dispatch:
    schedule:
        -   cron: '19 17 * * 6'

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        strategy:
            fail-fast: true
            matrix:
                include:
                    -   language: actions
                        build-mode: none
                    -   language: javascript-typescript
                        build-mode: none
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: ${{ matrix.language }}
                    build-mode: ${{ matrix.build-mode }}
                    config-file: ./.github/codeql/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: '/language:${{ matrix.language }}'

# Main shop & wildcard sales channels
server {
    listen 80;
    server_name booking.docker *.booking.docker;

    # Mercure SSE hub — long-lived streams: buffering off, generous read
    # timeout, explicit HTTP/1.1 keepalive to the hub.
    location /.well-known/mercure {
        proxy_pass http://fib-mercure:80;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location / {
        proxy_pass http://fib-shopware:80;
        proxy_http_version 1.1;
        proxy_hide_header Upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

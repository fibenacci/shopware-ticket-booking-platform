# Central dev ingress — single entry point behind the dinghy HTTP proxy.
# All *.booking.docker hosts route through THIS container to explicit
# container NAMES (never compose service aliases: those collide with other
# projects' stacks on the shared `proxy` network).

# TLS terminates at the dinghy proxy (certs from docker/dev-certs.sh) — keep
# its X-Forwarded-Proto so upstream apps know the request was https; fall
# back to our own scheme for direct (port-mapped) access.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Default 404 for unknown domains
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# Scanner app (static SPA + same-origin /api proxy, served by fib-scanner)
server {
    listen 80;
    server_name scanner.booking.docker;

    location / {
        proxy_pass http://fib-scanner:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# Mailpit
server {
    listen 80;
    server_name mail.booking.docker;

    location / {
        proxy_pass http://fib-mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# Adminer
server {
    listen 80;
    server_name adminer.booking.docker;

    location / {
        proxy_pass http://fib-adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# Storefront Watcher (dockware)
server {
    listen 80;
    server_name watch-storefront.booking.docker;

    error_page 502 /502-watcher.html;
    location = /502-watcher.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        proxy_pass http://fib-shopware:9998;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host booking.docker;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# Admin Watcher (dockware)
server {

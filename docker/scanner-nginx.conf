# Scanner app — static SPA + same-origin /api proxy to the Shopware container.
# The app's CSP restricts connect-src to 'self', so the Admin API must be
# reachable on the SAME origin: nginx proxies /api/* to shopware.

# Preserve the original scheme from the ingress/proxy chain (https when the
# request came in via TLS); fall back to our own for direct access.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        # Container NAME, not the compose service alias: "shopware" also
        # resolves to other projects' containers on the shared proxy network.
        proxy_pass http://fib-shopware/api/;
        proxy_set_header Host booking.docker;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# Production nginx for the scanner app: SPA + same-origin /api proxy to the
# shop container (`web` service in compose.prod.yaml, port 8000).
#
# The upstream is resolved at REQUEST time via Docker's embedded DNS
# (variable + resolver): nginx starts even if `web` is still booting and
# follows container restarts/IP changes without a reload.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream web;
        proxy_pass http://$upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

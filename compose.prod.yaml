# Production deployment — single-host Docker Compose with a Traefik edge.
#
# Usage:
#   1. Point DNS A/AAAA records for ${SHOP_DOMAIN} and scanner.${SHOP_DOMAIN}
#      at the host.
#   2. Create a `.env.prod` next to this file (see the ${...} variables below).
#   3. docker compose -f compose.prod.yaml --env-file .env.prod up -d
#
# Traefik terminates TLS (Let's Encrypt, auto-renewal), redirects HTTP→HTTPS
# and routes by hostname via the labels on `web` and `scanner`. The `init`
# service runs the deployment-helper once per deploy (system install /
# migrations / plugin lifecycle), then web/worker/scheduler start.
# Images are built + pushed by .github/workflows/docker-publish.yml.

x-shopware-image: &shopware-image ${SHOPWARE_IMAGE:-ghcr.io/CHANGEME/fib-booking-system:latest}

x-environment: &shopware-env
    APP_ENV: prod
    APP_DEBUG: 0
    APP_URL: https://${SHOP_DOMAIN:?SHOP_DOMAIN is required, e.g. booking.example.com}
    APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
    DATABASE_URL: mysql://shopware:${DB_PASSWORD:?DB_PASSWORD is required}@db:3306/shopware
    MAILER_DSN: ${MAILER_DSN:-null://null}
    MESSENGER_TRANSPORT_DSN: doctrine://default
    LOCK_DSN: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2
    REDIS_DSN: redis://:${REDIS_PASSWORD}@redis:6379
    SHOPWARE_HTTP_CACHE_ENABLED: 1
    SHOPWARE_ES_ENABLED: 0
    PHP_SESSION_HANDLER: redis
    PHP_SESSION_SAVE_PATH: tcp://redis:6379/1?auth=${REDIS_PASSWORD}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
    # HMAC secret for the self-hosted ALTCHA captcha (config/packages/bot_protection.yaml).
    # Generate once: openssl rand -hex 32
    ALTCHA_SECRET_KEY: ${ALTCHA_SECRET_KEY:?ALTCHA_SECRET_KEY is required — generate with `openssl rand -hex 32`}
    # Optional: Sentry/GlitchTip error tracking (config/packages/sentry.yaml).
    # Empty = disabled.
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_RELEASE: ${SENTRY_RELEASE:-}

x-volumes: &shopware-volumes
    - files:/var/www/html/files
    - theme:/var/www/html/public/theme
    - media:/var/www/html/public/media
    - thumbnail:/var/www/html/public/thumbnail
    - sitemap:/var/www/html/public/sitemap

services:
    traefik:
        image: traefik:v3
        command:
            - '--providers.docker=true'
            - '--providers.docker.exposedbydefault=false'
            - '--entrypoints.web.address=:80'
            - '--entrypoints.websecure.address=:443'
            # Force HTTPS everywhere
            - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
            - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
            # Let's Encrypt with automatic renewal
            - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required for the ACME/TLS certificate resolver}'
            - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
            - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik_certs:/letsencrypt
        restart: always

    init:
        image: *shopware-image
        entrypoint: /setup
        environment: *shopware-env
        volumes: *shopware-volumes
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: 'no'

    web:
        image: *shopware-image
        environment: *shopware-env
        volumes: *shopware-volumes
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.shop.rule=Host(`${SHOP_DOMAIN:?SHOP_DOMAIN is required, e.g. booking.example.com}`)'
            - 'traefik.http.routers.shop.entrypoints=websecure'
            - 'traefik.http.routers.shop.tls.certresolver=letsencrypt'
            - 'traefik.http.services.shop.loadbalancer.server.port=8000'
            # Edge rate limit for account registration (anti bot-flood,
            # OWASP OAT-019): ~5 registrations per hour per client IP with a
            # small burst allowance. Legitimate users register once; this only
            # bites scripted mass sign-ups. The dedicated router matches before
            # the catch-all `shop` router (longer rule = higher priority).
            - 'traefik.http.middlewares.register-ratelimit.ratelimit.average=5'
            - 'traefik.http.middlewares.register-ratelimit.ratelimit.period=1h'
            - 'traefik.http.middlewares.register-ratelimit.ratelimit.burst=3'
            - 'traefik.http.routers.shop-register.rule=Host(`${SHOP_DOMAIN}`) && Method(`POST`) && (Path(`/account/register`) || Path(`/store-api/account/register`))'
            - 'traefik.http.routers.shop-register.entrypoints=websecure'
            - 'traefik.http.routers.shop-register.tls.certresolver=letsencrypt'
            - 'traefik.http.routers.shop-register.middlewares=register-ratelimit'
            - 'traefik.http.routers.shop-register.service=shop'
        depends_on:
            init:
                condition: service_completed_successfully
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/_info/health-check']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        restart: always

    # Operator scanner app: static SPA + same-origin /api proxy to `web`
    # (image built from custom/static-plugins/FibBookingSystem/apps/scanner).
    scanner:
        image: ${SCANNER_IMAGE:-ghcr.io/CHANGEME/fib-booking-scanner:latest}
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.scanner.rule=Host(`scanner.${SHOP_DOMAIN}`)'
            - 'traefik.http.routers.scanner.entrypoints=websecure'
            - 'traefik.http.routers.scanner.tls.certresolver=letsencrypt'
            - 'traefik.http.services.scanner.loadbalancer.server.port=80'
        depends_on:
            web:
                condition: service_healthy
        restart: always

    worker:
        image: *shopware-image
        entrypoint: ['php', 'bin/console', 'messenger:consume', 'async', 'low_priority', 'failed', '--time-limit=300', '--memory-limit=256M']
        environment: *shopware-env
        volumes: *shopware-volumes
        depends_on:
            init:
                condition: service_completed_successfully
        restart: always
        deploy:
            replicas: ${WORKER_REPLICAS:-1}

    scheduler:
        image: *shopware-image
        entrypoint: ['php', 'bin/console', 'scheduled-task:run', '--time-limit=300', '--memory-limit=256M']
        environment: *shopware-env
        volumes: *shopware-volumes
        depends_on:
            init:
                condition: service_completed_successfully
        restart: always

    db:
        image: mariadb:11.4
        command: >
            --max-allowed-packet=1073741824
            --innodb-buffer-pool-size=1G
            --innodb-flush-log-at-trx-commit=2
        environment:
            MARIADB_DATABASE: shopware
            MARIADB_USER: shopware
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            timeout: 5s
            retries: 10
        restart: always

    redis:
        image: redis:7-alpine
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--maxmemory', '512mb', '--maxmemory-policy', 'volatile-lru', '--appendonly', 'yes']
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5
        restart: always

volumes:
    db_data:
    redis_data:
    traefik_certs:
    files:
    theme:
    media:
    thumbnail:
    sitemap:

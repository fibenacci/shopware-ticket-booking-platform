# Production caching on Redis (compose.prod.yaml provides REDIS_DSN).
# Lives in packages/prod/ so dev/CI keep the zero-dependency filesystem cache.
#
# Redis DB allocation (sessions use DB 1, locks DB 2 — see compose.prod.yaml):
#   3  object cache (ephemeral — flushable at any time)
#   4  carts + number ranges (persistent — must survive a cache flush)
#
# cache.system intentionally stays on the local adapter: it is hot, small and
# touched during console runs at image-build time, where no Redis exists.
shopware:
    redis:
        connections:
            ephemeral:
                dsn: '%env(REDIS_DSN)%/3'
            persistent:
                dsn: '%env(REDIS_DSN)%/4?persistent=1'
    # Carts move off MySQL — fewer hot-row writes, faster checkout.
    cart:
        storage:
            type: 'redis'
            config:
                connection: 'persistent'
    # Atomic increments instead of SELECT … FOR UPDATE on order numbers.
    number_range:
        increment_storage: 'redis'
        config:
            connection: 'persistent'

framework:
    cache:
        # Shared object cache across web + worker + scheduler replicas; also
        # backs the HTTP cache pool when SHOPWARE_HTTP_CACHE_ENABLED=1.
        app: cache.adapter.redis_tag_aware
        default_redis_provider: '%env(REDIS_DSN)%/3'

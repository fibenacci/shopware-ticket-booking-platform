# Registration hardening / bot protection (OWASP OAT-019 "Account Creation").
#
# Uses Shopware's static system config: values defined here OVERRIDE the
# database, so these protections cannot be disabled through the admin UI —
# neither accidentally nor by a compromised admin account. The admin captcha
# settings page will still render its (stale) DB values; runtime always uses
# the values below.
# https://developer.shopware.com/docs/guides/hosting/configurations/shopware/static-system-config.html
#
# Layers (edge rate limiting lives in compose.prod.yaml, Traefik labels):
#   1. Double opt-in  — unconfirmed accounts are worthless to bots
#   2. Honeypot       — free, catches naive form-filling bots
#   3. ALTCHA         — self-hosted, invisible proof-of-work captcha
#                       (no third party, no user interaction, GDPR-clean)

parameters:
    # Dev fallback only. Production injects a real secret via the
    # ALTCHA_SECRET_KEY environment variable — compose.prod.yaml refuses to
    # start without it, so this value never reaches production.
    env(ALTCHA_SECRET_KEY): 'dev-altcha-secret-not-for-production'

shopware:
    system_config:
        default:
            # Registrations only become active customers after the email
            # address is confirmed (double opt-in).
            core.loginRegistration.doubleOptInRegistration: true

            core.basicInformation.activeCaptchasV2:
                honeypot:
                    name: honeypot
                    isActive: true
                altchaCaptcha:
                    name: altchaCaptcha
                    isActive: true
                    config:
                        secretKey: '%env(ALTCHA_SECRET_KEY)%'
                        # Logged-in (non-guest) customers skip the challenge.
                        whitelistCustomers: true
                        hideLogo: false
                        hideFooter: false
                        # Solve the proof-of-work when the form is submitted …
                        autoMode: 'onsubmit'
                        # … and without any visible widget/interaction.
                        invisible: true

# Registration hardening / bot protection (OWASP OAT-019 "Account Creation").
#
# Uses Shopware's static system config: values defined here OVERRIDE the
# database, so they cannot be disabled through the admin UI — neither
# accidentally nor by a compromised admin account.
# https://developer.shopware.com/docs/guides/hosting/configurations/shopware/static-system-config.html
#
# NOTE: static system config only accepts SCALAR values (the config tree uses
# a scalar prototype — nested objects fail the container build). The captcha
# configuration (`core.basicInformation.activeCaptchasV2`, a JSON object) is
# therefore applied to the database by bin/activate-bot-protection.sh, which
# the deployment helper runs on every deploy (.shopware-project.yml hooks).
#
# Layers (edge rate limiting lives in compose.prod.yaml, Traefik labels):
#   1. Double opt-in  — enforced here, unconfirmed accounts are worthless
#   2. Honeypot       — activated by bin/activate-bot-protection.sh
#   3. ALTCHA         — activated by bin/activate-bot-protection.sh

shopware:
    system_config:
        default:
            # Registrations only become active customers after the email
            # address is confirmed (double opt-in).
            core.loginRegistration.doubleOptInRegistration: true
